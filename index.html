<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Four Rolls Photo</title>
  <meta name="description" content="A late-night photo shop: a letter at the counter, four rolls of film, and a darkroom out back.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@500;700;900&family=Oswald:wght@400;500;600;700&family=Special+Elite&display=swap">
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <script src="./vendor/gsap.min.js"></script>
</head>
<body data-scene="shop">
  <main class="screen">
    <div id="stage" class="stage" aria-label="A photo shop at night"></div>

    <header class="hud">
      <p id="hud-scene" class="hud-tag">街外 · OUTSIDE</p>
      <p id="hud-count" class="hud-tag hud-right">營業中 · OPEN</p>
      <div id="hud-title" class="hud-title">
        <h1><b>四卷沖印</b><span>FOUR ROLLS PHOTO</span></h1>
        <p>every season we kept, wound up and waiting</p>
      </div>
      <div id="hud-caption" class="hud-caption" hidden>
        <small></small>
        <em></em>
      </div>
    </header>

    <button id="hud-back" class="hud-back" type="button" hidden><i>←</i> 櫃面 COUNTER</button>
    <button id="sound" class="sound" type="button" aria-pressed="true">sound on</button>
    <button id="side-note" class="side-note" type="button" hidden><b></b><span><em></em> <i>→</i></span></button>

    <section id="picker" class="picker" hidden aria-label="Choose negatives">
      <div class="picker-card">
        <header><h2></h2><p></p><span class="picker-count"></span></header>
        <div class="picker-grid"></div>
        <footer><button type="button" class="picker-cancel">cancel</button><button type="button" class="picker-done"></button></footer>
      </div>
    </section>

    <div id="zoom" class="zoom" hidden><img alt="A frame seen through the loupe"></div>

    <section id="letter" class="letter" hidden aria-label="A letter left at the counter">
      <article class="letter-paper">
        <p class="letter-head">FOUR ROLLS PHOTO · TO BE COLLECTED</p>
        <p class="letter-to"></p>
        <div class="letter-body"></div>
        <p class="letter-sign"></p>
        <button class="letter-done" type="button" hidden>put it away, see the rolls <i>→</i></button>
      </article>
    </section>

    <section id="receipt" class="receipt" hidden aria-label="Pick-up slip">
      <header><b>四卷沖印</b><span>FOUR ROLLS PHOTO · 1 HOUR</span></header>
      <p class="receipt-meta">取件單 No. 0425 · <span class="receipt-date"></span></p>
      <ul class="receipt-rows"></ul>
      <p class="receipt-foot">多謝光臨 · THANK YOU</p>
      <div class="receipt-stamp">已取件<small>COLLECTED</small></div>
    </section>

    <div id="toast" class="toast" hidden><small></small><b></b><span></span></div>
    <div id="fx" class="fx"></div>
    <div id="anchors" class="anchors"></div>
    <div id="grain" class="grain"></div>
    <div class="vignette"></div>
    <div id="fade" class="shutter" aria-hidden="true"><span>四卷沖印 · FOUR ROLLS PHOTO</span></div>
  </main>

  <footer id="hint" class="hint">
    <span id="hint-text"></span>
    <button id="hint-action" class="hint-action" type="button" hidden><span></span> <i>→</i></button>
    <button id="hint-cta" class="hint-cta" type="button" hidden><span></span> <i>→</i></button>
  </footer>
  <div id="tag" class="tag" aria-hidden="true"></div>

  <script>
    // fine film grain: one noise tile at device resolution, jittered rather than redrawn
    (() => {
      const el = document.getElementById('grain');
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const img = g.createImageData(size, size);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = 128 + (Math.random() + Math.random() + Math.random() - 1.5) * 90;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      el.style.backgroundImage = `url(${c.toDataURL()})`;
      el.style.backgroundSize = `${size / devicePixelRatio}px`;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      setInterval(() => {
        el.style.backgroundPosition = `${(Math.random() * size) | 0}px ${(Math.random() * size) | 0}px`;
      }, 70);
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

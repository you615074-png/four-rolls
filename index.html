<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Four Rolls</title>
  <meta name="description" content="Four rolls of film, a darkroom, and a letter.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Special+Elite&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <script src="./vendor/gsap.min.js"></script>
</head>
<body data-scene="table">
  <main class="screen">
    <div id="stage" class="stage" aria-label="A table with four rolls of film"></div>

    <header class="hud">
      <p id="hud-scene" class="hud-tag">SCENE 04 · THE ROLLS</p>
      <p id="hud-count" class="hud-tag hud-right">4 ROLLS · 96 FRAMES</p>
      <div id="hud-title" class="hud-title">
        <h1>Four rolls, <em>one us</em></h1>
        <p>every season we kept, wound up and waiting</p>
      </div>
      <div id="hud-caption" class="hud-caption" hidden>
        <small></small>
        <em></em>
      </div>
    </header>

    <button id="hud-back" class="hud-back" type="button" hidden>← BACK TO THE TABLE</button>
    <button id="cta" class="cta" type="button" hidden><span class="cta-text"><small></small><b></b></span><i>→</i></button>

    <section id="picker" class="picker" hidden aria-label="Choose negatives">
      <div class="picker-card">
        <header><h2></h2><p></p><span class="picker-count"></span></header>
        <div class="picker-grid"></div>
        <footer><button type="button" class="picker-cancel">cancel</button><button type="button" class="picker-done"></button></footer>
      </div>
    </section>

    <div id="zoom" class="zoom" hidden><img alt="A frame seen through the loupe"></div>

    <section id="letter" class="letter" hidden>
      <div class="envelope"><span>for you</span></div>
      <article class="letter-paper">
        <p class="letter-head">ROLL 04 · STILL US · 96 FRAMES</p>
        <p class="letter-body"></p>
      </article>
    </section>

    <div id="anchors" class="anchors"></div>
    <div id="grain" class="grain"></div>
    <div class="vignette"></div>
    <div id="fade" class="fade"></div>
  </main>

  <footer id="hint" class="hint">
    <span id="hint-text">pick one</span>
    <button id="hint-action" class="hint-action" type="button" hidden><span></span> <i>→</i></button>
  </footer>
  <div id="tag" class="tag" aria-hidden="true"></div>

  <script>
    // fine film grain: one noise tile at device resolution, jittered rather than redrawn
    (() => {
      const el = document.getElementById('grain');
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const img = g.createImageData(size, size);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = 128 + (Math.random() + Math.random() + Math.random() - 1.5) * 90;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      el.style.backgroundImage = `url(${c.toDataURL()})`;
      el.style.backgroundSize = `${size / devicePixelRatio}px`;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      setInterval(() => {
        el.style.backgroundPosition = `${(Math.random() * size) | 0}px ${(Math.random() * size) | 0}px`;
      }, 70);
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
